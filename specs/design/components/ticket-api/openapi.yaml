openapi: 3.0.3
info:
  title: Ticket API
  version: 0.1.0
  description: Owns support tickets, their AI-drafted replies, and sending approved replies by email.
servers:
  - url: /
security:
  - oauth2: []
paths:
  /tickets:
    post:
      operationId: submitTicket
      summary: A customer submits a new support ticket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTicket'
      responses:
        '201':
          description: The ticket was created and queued for triage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: The request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listTickets
      summary: Every ticket in the triage queue
      security:
        - oauth2: [tickets:read-all]
      parameters:
        - name: urgency
          in: query
          schema:
            $ref: '#/components/schemas/Urgency'
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, triaged, replied]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of tickets
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count:
                    type: integer
                    description: total matching tickets
                  next:
                    type: string
                    nullable: true
                    description: relative URI of the next page
                  previous:
                    type: string
                    nullable: true
                    description: relative URI of the previous page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
        '401':
          description: No valid signed-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Every ticket's detail, including its drafted reply
      security:
        - oauth2: [tickets:read-all]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The ticket and its reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '404':
          description: No ticket with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid signed-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticketId}/reply:
    patch:
      operationId: updateReply
      summary: Edit a ticket's drafted reply before approving it
      security:
        - oauth2: [tickets:update]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyUpdate'
      responses:
        '200':
          description: The updated reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
        '404':
          description: No ticket with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: The request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid signed-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticketId}/reply/approve:
    post:
      operationId: approveReply
      summary: Approve a ticket's reply so it is sent to the customer by email
      security:
        - oauth2: [tickets:approve]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The reply was approved and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
        '404':
          description: No ticket with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid signed-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            tickets:read-all: Every ticket in the queue
            tickets:update: Edit a ticket's drafted reply
            tickets:approve: Approve a reply so it is sent
  schemas:
    Urgency:
      type: string
      enum: [Low, Medium, High, Critical]
    NewTicket:
      type: object
      required: [customerEmail, subject, body]
      properties:
        customerEmail:
          type: string
        subject:
          type: string
        body:
          type: string
    Ticket:
      type: object
      required: [id, customerEmail, subject, urgency, status, createdAt]
      properties:
        id:
          type: string
        customerEmail:
          type: string
        subject:
          type: string
        urgency:
          $ref: '#/components/schemas/Urgency'
        status:
          type: string
          enum: [submitted, triaged, replied]
        createdAt:
          type: string
          format: date-time
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [body, reply]
          properties:
            body:
              type: string
            reply:
              $ref: '#/components/schemas/Reply'
    Reply:
      type: object
      required: [id, ticketId, body, status]
      properties:
        id:
          type: string
        ticketId:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, approved, sent]
        approvedAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
    ReplyUpdate:
      type: object
      required: [body]
      properties:
        body:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
