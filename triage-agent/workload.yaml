apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: triage-agent

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  resources:
    - ref: amp-verify-agent-memory-db
      envBindings:
        dbname: MEMORY_DB_DBNAME
        host: MEMORY_DB_HOST
        password: MEMORY_DB_PASSWORD
        port: MEMORY_DB_PORT
        user: MEMORY_DB_USER
    - ref: amp-verify-agent-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES

# Redeploy marker so this cycle's diff includes the component.
